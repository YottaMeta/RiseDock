<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="45%" stop-color="#0f0f2e"/>
      <stop offset="75%" stop-color="#141432"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#667eea" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#667eea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#764ba2" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#764ba2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#c7d2fe"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="launchGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0 L0 0 0 56" fill="none" stroke="#667eea" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <ellipse cx="200" cy="180" rx="320" ry="240" fill="url(#glowA)" filter="url(#blur)"/>
  <ellipse cx="1020" cy="70" rx="240" ry="200" fill="url(#glowB)" filter="url(#blur)"/>
  <ellipse cx="1080" cy="300" rx="220" ry="180" fill="url(#glowC)" filter="url(#blur)"/>

  <!-- ===== LEFT: wordmark ===== -->
  <rect x="70" y="58" width="176" height="28" rx="14" fill="#667eea" fill-opacity="0.14" stroke="#667eea" stroke-opacity="0.32"/>
  <circle cx="86" cy="72" r="3.5" fill="#667eea"/>
  <text x="98" y="76" font-size="12" fill="#818cf8" letter-spacing="2">SCENE LAUNCHER</text>

  <rect x="70" y="104" width="54" height="54" rx="16" fill="url(#logoGrad)"/>
  <path d="M97 116 L90 128 L104 128 Z" fill="#ffffff"/>
  <text x="140" y="150" font-size="40" font-weight="800" fill="url(#titleGrad)" letter-spacing="6">启程典</text>
  <text x="142" y="176" font-size="15" fill="#94a3b8" letter-spacing="4">RiseDock</text>

  <text x="70" y="216" font-size="20" font-weight="500" fill="#e2e8f0">你的桌面，从此只剩一个图标</text>
  <text x="70" y="242" font-size="14" fill="#64748b">一个场景，一键开工</text>

  <!-- ===== RIGHT: product UI mockup ===== -->
  <rect x="598" y="42" width="564" height="280" rx="24" fill="#667eea" fill-opacity="0.12"/>
  <rect x="600" y="44" width="560" height="276" rx="22" fill="#1a1a2e" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- window header -->
  <rect x="620" y="58" width="22" height="22" rx="7" fill="url(#logoGrad)"/>
  <path d="M631 62 L626 70 L636 70 Z" fill="#ffffff"/>
  <text x="650" y="74" font-size="14" font-weight="500" fill="#e2e8f0">启程典 RiseDock</text>
  <circle cx="1120" cy="69" r="4" fill="#ef4444"/>
  <circle cx="1134" cy="69" r="4" fill="#f59e0b"/>
  <circle cx="1148" cy="69" r="4" fill="#10b981"/>
  <line x1="616" y1="82" x2="1144" y2="82" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- scene cards -->
  <!-- card 1 (active) -->
  <rect x="616" y="96" width="168" height="150" rx="14" fill="#667eea" fill-opacity="0.12" stroke="#667eea" stroke-opacity="0.45"/>
  <text x="630" y="124" font-size="13" font-weight="600" fill="#e2e8f0">工作</text>
  <rect x="736" y="108" width="34" height="18" rx="4" fill="#10b981" fill-opacity="0.15"/>
  <text x="753" y="121" font-size="10" fill="#34d399" text-anchor="middle">7 项</text>
  <rect x="630" y="144" width="20" height="20" rx="6" fill="#3b82f6"/>
  <rect x="656" y="144" width="20" height="20" rx="6" fill="#10b981"/>
  <rect x="682" y="144" width="20" height="20" rx="6" fill="#f59e0b"/>
  <rect x="708" y="144" width="20" height="20" rx="6" fill="#ef4444"/>
  <rect x="630" y="170" width="20" height="20" rx="6" fill="#8b5cf6"/>
  <rect x="656" y="170" width="20" height="20" rx="6" fill="#06b6d4"/>
  <rect x="682" y="170" width="20" height="20" rx="6" fill="#ec4899"/>
  <rect x="630" y="214" width="46" height="18" rx="5" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="653" y="227" font-size="10" fill="#94a3b8" text-anchor="middle">Ctrl+1</text>

  <!-- card 2 -->
  <rect x="796" y="96" width="168" height="150" rx="14" fill="#0f0f1a" fill-opacity="0.65" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="810" y="124" font-size="13" font-weight="600" fill="#e2e8f0">学习</text>
  <rect x="916" y="108" width="34" height="18" rx="4" fill="#10b981" fill-opacity="0.15"/>
  <text x="933" y="121" font-size="10" fill="#34d399" text-anchor="middle">4 项</text>
  <rect x="810" y="144" width="20" height="20" rx="6" fill="#3b82f6"/>
  <rect x="836" y="144" width="20" height="20" rx="6" fill="#10b981"/>
  <rect x="862" y="144" width="20" height="20" rx="6" fill="#f59e0b"/>
  <rect x="888" y="144" width="20" height="20" rx="6" fill="#ef4444"/>
  <rect x="810" y="214" width="46" height="18" rx="5" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="833" y="227" font-size="10" fill="#94a3b8" text-anchor="middle">Ctrl+2</text>

  <!-- card 3 -->
  <rect x="976" y="96" width="168" height="150" rx="14" fill="#0f0f1a" fill-opacity="0.65" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="990" y="124" font-size="13" font-weight="600" fill="#e2e8f0">设计</text>
  <rect x="1096" y="108" width="34" height="18" rx="4" fill="#10b981" fill-opacity="0.15"/>
  <text x="1113" y="121" font-size="10" fill="#34d399" text-anchor="middle">5 项</text>
  <rect x="990" y="144" width="20" height="20" rx="6" fill="#3b82f6"/>
  <rect x="1016" y="144" width="20" height="20" rx="6" fill="#10b981"/>
  <rect x="1042" y="144" width="20" height="20" rx="6" fill="#f59e0b"/>
  <rect x="1068" y="144" width="20" height="20" rx="6" fill="#ef4444"/>
  <rect x="990" y="170" width="20" height="20" rx="6" fill="#8b5cf6"/>
  <rect x="990" y="214" width="46" height="18" rx="5" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="1013" y="227" font-size="10" fill="#94a3b8" text-anchor="middle">Ctrl+3</text>

  <!-- launch bar -->
  <rect x="616" y="258" width="528" height="46" rx="12" fill="#0f0f1a" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="632" y="286" font-size="13" fill="#94a3b8">已选中 <tspan fill="#e2e8f0" font-weight="600">工作</tspan> 场景 · 共 7 个启动项</text>
  <rect x="1078" y="268" width="58" height="26" rx="10" fill="url(#launchGrad)"/>
  <text x="1107" y="285" font-size="12" fill="#ffffff" text-anchor="middle">一键启动</text>

  <!-- subtle sparkles -->
  <circle cx="588" cy="92" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
  <circle cx="1150" cy="300" r="2.5" fill="#ffffff" fill-opacity="0.4"/>
  <circle cx="560" cy="280" r="2" fill="#ffffff" fill-opacity="0.35"/>
</svg>
